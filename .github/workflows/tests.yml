name: tests

on:
  push:
    branches: [main, dev-4.x]
  pull_request:

jobs:
  # The whole suite against a live server, on every Laravel the package declares: every test that
  # resolves a connection opens a real PDO connection, and without a server behind it two thirds
  # of the suite would only be skipped.
  #
  # The matrix runs the floor of the range (Laravel 11 on PHP 8.2), each major above it, and the
  # newest PHP the framework allows (8.5), so both ends of what composer.json promises are checked
  # rather than assumed.
  tests:
    name: tests / PHP ${{ matrix.runtime.php }}, Laravel ${{ matrix.runtime.laravel }}, Manticore ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    env:
      MANTICORE_TEST_BUDDY: '1'
      MANTICORE_TEST_EXPECTED_VERSION: ${{ matrix.server.expected }}
      MANTICORE_TEST_IMAGE: ${{ matrix.server.image }}

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php: '8.2'
            laravel: '11'
            testbench: '^9.0'
            eol: true
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'

        server:
          - name: minimum-28.6.6
            image: manticoresearch/manticore:28.6.6@sha256:341f333906fb2183fe585ad66de3486f372b2bbdd39e0e001d280a54f06d893a
            expected: '28.6.6'
          - name: latest
            image: manticoresearch/manticore:latest
            expected: ''

    services:
      manticore:
        image: ${{ matrix.server.image }}
        ports:
          # the port the tests expect by default, see MANTICORE_TEST_HOST/MANTICORE_TEST_PORT
          # in phpunit.xml.dist
          - 9306:9306

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.runtime.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json
          coverage: none

      - name: Cache the composer files
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.runtime.php }}-${{ matrix.runtime.testbench }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.runtime.php }}-${{ matrix.runtime.testbench }}-

      # Laravel 11 reached the end of its security support on March 12th, 2026, so every release
      # of it is flagged by an advisory and composer refuses to install one from scratch. It is
      # the floor of the package all the same: an application already running it installs this
      # package without a word, because composer never re-resolves what is already there. Testing
      # that floor is the one case that does ask for the framework from scratch, hence the flag -
      # a dev-only dependency, in a runner thrown away at the end of the job.
      - name: Allow the EOL framework of this job
        if: matrix.runtime.eol
        run: composer config audit.block-insecure false

      # the testbench pins the Laravel of the job; update, not install, because a library ships
      # no composer.lock and the current dependencies are what has to be checked
      - name: Install the dependencies
        run: |
          composer require --dev --no-update --no-interaction "orchestra/testbench:${{ matrix.runtime.testbench }}"
          composer update --prefer-dist --no-progress --no-interaction

      # the image promises no mysql or curl of its own, so the port is waited for from the
      # outside rather than through a health check of the container
      - name: Wait for Manticore
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/9306) >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo 'Manticore did not answer on 127.0.0.1:9306'
          exit 1

      - name: Verify server version and required modules
        run: php tests/check-server.php

      - name: Run the tests
        run: vendor/bin/phpunit --fail-on-skipped

      - name: Verify a production-only consumer
        run: |
          php tests/prepare-production.php ${{ matrix.runtime.laravel }}
          composer update --working-dir=build/production --no-dev --prefer-dist --no-progress --no-interaction
          php tests/production-smoke.php build/production/vendor/autoload.php --live
